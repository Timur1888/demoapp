_schema-version: "3.2"
ID: demoappdemoapp
description: Generated by Fiori Tools
version: 0.0.3
modules:
  # 1) Deploy App Content ins HTML5 Repo (app deployer module - store xsuaa)
  - name: demoappdemoapp-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: demoappdemoapp-repo-host
        parameters:
          content-target: true
      - name: demoappdemoapp-uaa
    build-parameters:
      builder: custom
      commands:
        - mkdir -p resources
        - cp workzone/cdm.json resources/cdm.json
      build-result: resources
      requires:
        - name: demoappdemoapp
          artifacts:
            - demoappdemoapp.zip
          target-path: resources/
  # 2) UI5 Build Modul (App Module)
  - name: demoappdemoapp
    type: html5
    path: Application
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
  # 3) Deploy Destination module (create CDM DT destination)
  - name: demoappdemoapp-dest-content
    type: com.sap.application.content
    requires:
      - name: demoappdemoapp-dest-srv
        parameters:
          content-target: true
      - name: demoappdemoapp-repo-runtime
        parameters:
          service-key:
            name: demoappdemoapp-repo-runtime-key
    parameters:
      content:
        subaccount:
          destinations:
            - Name: demoappdemoapp-dt
              ServiceInstanceName: demoappdemoapp-html5-rt-srv
              ServiceKeyName: demoappdemoapp-repo-runtime-key
              URL: https://html5-apps-repo-rt.${default-domain}/applications/cdm/demo.app.demoapp
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
      ########################################################################################################################################
resources:
  # HTML5 Repo Host - upload html5 apps
  - name: demoappdemoapp-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: demoappdemoapp-html5-srv
      service-plan: app-host
  # XSUAA 
  - name: demoappdemoapp-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
      service-name: demoappdemoapp-xsuaa-srv
  # Destination Service (for CDM RT destination)
  - name: demoappdemoapp-dest-srv
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        init_data:
          subaccount:
            destinations:
              - Authentication: NoAuthentication
                Name: demoappdemoapp-rt
                ProxyType: Internet
                Type: HTTP
                URL: https://billing-dev-5uwgy3of.launchpad.${default-domain}
          existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: demoappdemoapp-dest-srv
      service-plan: lite
  # HTML5 Repo Runtime (wichtig für Approuter Route "service": "html5-apps-repo-rt"), HTML5 app-runtime resource for CDM DT destination
  - name: demoappdemoapp-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: demoappdemoapp-html5-rt-srv
      service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
