_schema-version: "3.2"
ID: demoappdemoapp
description: Generated by Fiori Tools
version: 0.0.1

modules:
  # 1) Deploy Destination Content (wie gehabt)
  - name: demoappdemoapp-destination-content
    type: com.sap.application.content
    requires:
      - name: demoappdemoapp-destination-service
        parameters:
          content-target: true
      - name: demoappdemoapp-repo-host
        parameters:
          service-key:
            name: demoappdemoapp-repo-host-key
      - name: demoappdemoapp-uaa
        parameters:
          service-key:
            name: demoappdemoapp-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: demoappdemoapp_html_repo_host
              ServiceInstanceName: demoappdemoapp-html5-service
              ServiceKeyName: demoappdemoapp-repo-host-key
              sap.cloud.service: demoappdemoapp
            - Authentication: OAuth2UserTokenExchange
              Name: demoappdemoapp_uaa
              ServiceInstanceName: demoappdemoapp-xsuaa-service
              ServiceKeyName: demoappdemoapp-uaa-key
              sap.cloud.service: demoappdemoapp
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # 2) Deploy App Content ins HTML5 Repo (wie gehabt)
  - name: demoappdemoapp-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: demoappdemoapp-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - demoappdemoapp.zip
          name: demoappdemoapp
          target-path: resources/

  # 3) UI5 Build Modul (wie gehabt)
  - name: demoappdemoapp
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # 4) NEW: Approuter CF Application (das hat dir gefehlt!)
  - name: demoappdemoapp-approuter
    type: approuter.nodejs
    path: approuter
    requires:
      - name: demoappdemoapp-uaa
      - name: demoappdemoapp-destination-service
      - name: demoappdemoapp-repo-runtime
    parameters:
      keep-existing-routes: true
      memory: 256M
      disk-quota: 256M

resources:
  # Destination Service (wie gehabt)
  - name: demoappdemoapp-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: demoappdemoapp-destination-service
      service-plan: lite

  # XSUAA (wie gehabt)
  - name: demoappdemoapp-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: demoappdemoapp-xsuaa-service
      service-plan: application

  # HTML5 Repo Host (wie gehabt)
  - name: demoappdemoapp-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: demoappdemoapp-html5-service
      service-plan: app-host

  # NEW: HTML5 Repo Runtime (wichtig für Approuter Route "service": "html5-apps-repo-rt")
  - name: demoappdemoapp-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: demoappdemoapp-html5-runtime
      service-plan: app-runtime

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true