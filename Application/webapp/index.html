<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>App Title</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-cachebuster/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "demo.app.demoapp": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSuppFort"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-flexibilityServices='[{"connector":"BtpServiceConnector","url":"/keyuser"}]'
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="demo.app.demoapp"
        data-id="container"
        data-settings='{"id" : "demo.app.demoapp"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
